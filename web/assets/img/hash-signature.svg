<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Hash y firma digital</title><desc id="d">La huella verifica cambios y la firma ayuda a verificar autoría.</desc><rect width="1200" height="700" rx="24" fill="#fbfcff"/><text x="42" y="70" font-family="system-ui" font-size="48" font-weight="850" fill="#10162b">Hash y firma digital</text><text x="42" y="108" font-family="system-ui" font-size="21" fill="#5e667a">Procedencia: de dónde viene un archivo y por qué manos pasó.</text><g transform="translate(42 150)"><rect width="1116" height="180" rx="20" fill="#fff" stroke="#ead9de"/><rect width="1116" height="58" rx="20" fill="#7e1227"/><text x="28" y="39" font-family="system-ui" font-size="25" font-weight="800" fill="#fff">Comparativa de huella digital (SHA-256)</text><text x="40" y="105" font-family="system-ui" font-size="18" font-weight="700" fill="#10162b">archivo A</text><rect x="160" y="80" width="900" height="40" rx="10" fill="#fff0f3"/><text x="182" y="106" font-family="monospace" font-size="16" fill="#8f0f2c">f211e8cddcbb6395f113a28379f88dacc21c3d3e30ffeb5e8c3825ee66a603a3</text><text x="40" y="154" font-family="system-ui" font-size="18" font-weight="700" fill="#10162b">archivo A.</text><rect x="160" y="129" width="900" height="40" rx="10" fill="#edf9fd"/><text x="182" y="155" font-family="monospace" font-size="16" fill="#167b9e">b393c0c4aaf0c6240e2a2c6380fca4bc61d98b07127da42bc2b93e776d494905</text></g><g transform="translate(42 365)"><rect width="530" height="280" rx="22" fill="#fff" stroke="#ead9de"/><rect width="530" height="64" rx="22" fill="#7e1227"/><text x="28" y="42" font-family="system-ui" font-size="27" font-weight="800" fill="#fff">1. Hash</text><text x="28" y="115" font-family="system-ui" font-size="29" font-weight="800" fill="#10162b">La huella digital</text><text x="28" y="154" font-family="system-ui" font-size="18" fill="#5e667a">Si cambia un byte, cambia la huella.</text><text x="28" y="180" font-family="system-ui" font-size="18" fill="#5e667a">SHA-256 produce 64 caracteres hex.</text><text x="90" y="245" font-size="58">📄 → #️⃣</text></g><g transform="translate(628 365)"><rect width="530" height="280" rx="22" fill="#fff" stroke="#d2e8f4"/><rect width="530" height="64" rx="22" fill="#2f95ba"/><text x="28" y="42" font-family="system-ui" font-size="27" font-weight="800" fill="#fff">2. Firma digital</text><text x="28" y="115" font-family="system-ui" font-size="29" font-weight="800" fill="#10162b">Garantía de autoría</text><text x="28" y="154" font-family="system-ui" font-size="18" fill="#5e667a">El publicador firma la huella de referencia.</text><text x="28" y="180" font-family="system-ui" font-size="18" fill="#5e667a">Quien descarga verifica firma + hash.</text><text x="105" y="245" font-size="58">🔑 → 📜 → ✅</text></g></svg>