<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Caso real de modelos maliciosos en repositorios públicos</title><desc id="d">Hallazgo, escenario de repositorio y ejecución al cargar el modelo.</desc><rect width="1200" height="700" rx="24" fill="#fbfcff"/><text x="42" y="54" font-family="system-ui" font-size="21" font-weight="700" fill="#7e1227">Cadena de suministro · caso real</text><text x="42" y="110" font-family="system-ui" font-size="43" font-weight="800" fill="#10162b">Modelos maliciosos podían ejecutar código al cargarse</text><g transform="translate(42 175)"><rect width="340" height="455" rx="22" fill="#fff" stroke="#ead9de"/><rect width="340" height="72" rx="22" fill="#8f0f2c"/><text x="28" y="46" font-family="system-ui" font-size="28" font-weight="800" fill="#fff">El hallazgo</text><text x="28" y="135" font-family="system-ui" font-size="64" font-weight="900" fill="#8f0f2c">≈100</text><text x="28" y="174" font-family="system-ui" font-size="25" font-weight="800" fill="#10162b">modelos maliciosos</text><text x="28" y="212" font-family="system-ui" font-size="18" fill="#5e667a">Documentados en 2024.</text><rect x="28" y="250" width="284" height="100" rx="14" fill="#fff0f3"/><text x="48" y="292" font-family="system-ui" font-size="18" font-weight="700" fill="#8f0f2c">Código de ejecución</text><text x="48" y="320" font-family="system-ui" font-size="18" font-weight="700" fill="#8f0f2c">incrustado en artefactos.</text><text x="125" y="410" font-size="62">🐞</text></g><g transform="translate(430 175)"><rect width="340" height="455" rx="22" fill="#fff" stroke="#d2e8f4"/><rect width="340" height="72" rx="22" fill="#2f95ba"/><text x="28" y="46" font-family="system-ui" font-size="28" font-weight="800" fill="#fff">El escenario</text><text x="28" y="135" font-family="system-ui" font-size="30" font-weight="800" fill="#10162b">Repositorio público</text><text x="28" y="176" font-family="system-ui" font-size="18" fill="#5e667a">Modelos y datasets se descargan</text><text x="28" y="202" font-family="system-ui" font-size="18" fill="#5e667a">como parte normal del trabajo.</text><rect x="55" y="245" width="230" height="150" rx="24" fill="#edf8fc"/><text x="142" y="305" font-size="58">☁️</text><text x="103" y="354" font-family="system-ui" font-size="25" font-weight="800" fill="#167b9e">Repositorio</text><text x="28" y="425" font-family="system-ui" font-size="18" font-weight="700" fill="#167b9e">La popularidad no verifica cada archivo.</text></g><g transform="translate(818 175)"><rect width="340" height="455" rx="22" fill="#fff" stroke="#f0dfbd"/><rect width="340" height="72" rx="22" fill="#d78212"/><text x="28" y="46" font-family="system-ui" font-size="28" font-weight="800" fill="#fff">El impacto</text><text x="28" y="135" font-family="system-ui" font-size="30" font-weight="800" fill="#10162b">Bastaba cargarlo</text><text x="28" y="176" font-family="system-ui" font-size="18" fill="#5e667a">La deserialización ejecutaba código</text><text x="28" y="202" font-family="system-ui" font-size="18" fill="#5e667a">en la máquina del usuario.</text><rect x="44" y="248" width="252" height="122" rx="18" fill="#151b2c"/><text x="66" y="294" font-family="monospace" font-size="18" fill="#86d7ff">load(model.pkl)</text><text x="66" y="328" font-family="monospace" font-size="18" fill="#ff6e88">⚠ ejecuta código</text><text x="28" y="425" font-family="system-ui" font-size="18" font-weight="700" fill="#b36500">Lección: verificar artefacto + formato.</text></g></svg>