<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Cargar un archivo de modelo puede ejecutar código</title><desc id="d">Comparación entre serialización insegura, advertencia de Python y formatos de solo pesos.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#fffaf1"/></linearGradient></defs><rect width="1200" height="700" rx="24" fill="url(#bg)"/><text x="42" y="54" font-family="system-ui" font-size="21" font-weight="700" fill="#7e1227">Cadena de suministro · cargar un modelo</text><text x="42" y="110" font-family="system-ui" font-size="44" font-weight="800" fill="#10162b">Cargar un archivo de modelo puede ejecutar código</text><text x="42" y="145" font-family="system-ui" font-size="22" fill="#5e667a">Abrir un artefacto desconocido puede equivaler a ejecutar un programa desconocido.</text><g transform="translate(42 190)"><rect width="340" height="430" rx="22" fill="#fff" stroke="#ead9de"/><rect width="340" height="72" rx="22" fill="#7e1227"/><text x="28" y="46" font-family="system-ui" font-size="28" font-weight="800" fill="#fff">Serialización</text><text x="28" y="125" font-family="system-ui" font-size="26" font-weight="800" fill="#10162b">pickle / joblib</text><text x="28" y="162" font-family="system-ui" font-size="19" fill="#5e667a">Guardan objetos de Python.</text><rect x="38" y="210" width="105" height="125" rx="14" fill="#ffe8ee"/><text x="58" y="278" font-size="48">📦</text><path d="M158 274h90" stroke="#7e1227" stroke-width="8"/><path d="m245 258 28 16-28 16" fill="none" stroke="#7e1227" stroke-width="8"/><rect x="273" y="210" width="40" height="125" rx="10" fill="#f5d0d9"/><text x="28" y="386" font-family="system-ui" font-size="18" fill="#7e1227" font-weight="700">Riesgo: código al deserializar.</text></g><g transform="translate(430 190)"><rect width="340" height="430" rx="22" fill="#fff" stroke="#d2e8f4"/><rect width="340" height="72" rx="22" fill="#2f95ba"/><text x="28" y="46" font-family="system-ui" font-size="28" font-weight="800" fill="#fff">Advertencia</text><text x="28" y="125" font-family="system-ui" font-size="26" font-weight="800" fill="#10162b">Python lo advierte</text><rect x="28" y="158" width="284" height="96" rx="14" fill="#ecf9fd"/><text x="45" y="192" font-family="monospace" font-size="16" fill="#187a9c">pickle no es seguro.</text><text x="45" y="220" font-family="monospace" font-size="16" fill="#187a9c">Solo carga datos confiables.</text><rect x="54" y="292" width="232" height="88" rx="14" fill="#151b2c"/><text x="76" y="328" font-family="monospace" font-size="18" fill="#86d7ff">pickle.load(f)</text><text x="76" y="357" font-family="monospace" font-size="18" fill="#ff6e88">⚠ código arbitrario</text></g><g transform="translate(818 190)"><rect width="340" height="430" rx="22" fill="#fff" stroke="#f0dfbd"/><rect width="340" height="72" rx="22" fill="#d78212"/><text x="28" y="46" font-family="system-ui" font-size="28" font-weight="800" fill="#fff">Alternativa</text><text x="28" y="125" font-family="system-ui" font-size="26" font-weight="800" fill="#10162b">Solo pesos</text><text x="28" y="162" font-family="system-ui" font-size="19" fill="#5e667a">Formatos que no serializan</text><text x="28" y="188" font-family="system-ui" font-size="19" fill="#5e667a">objetos ejecutables.</text><rect x="45" y="236" width="250" height="100" rx="18" fill="#fff5df"/><text x="72" y="280" font-family="system-ui" font-size="24" font-weight="800" fill="#a96809">safetensors</text><text x="72" y="312" font-family="system-ui" font-size="18" fill="#5e667a">tensores / pesos</text><text x="28" y="386" font-family="system-ui" font-size="18" fill="#069669" font-weight="700">✓ verificar procedencia + formato</text></g></svg>