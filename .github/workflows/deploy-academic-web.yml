name: Deploy academic web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "assets/wiki/**"
      - ".github/workflows/deploy-academic-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: academic-web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static academic web
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets/img
          cp -a web/. _site/
          cp assets/wiki/*.webp _site/assets/img/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
